# CI for NeoLibrary: runs the JUnit + Robolectric unit tests and builds the
# debug APK. The "unit-tests" job is a required status check on master
# (see Branch protection in the README), so PRs with failing tests cannot
# be merged.
name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

# One CI run per branch at a time; a newer push supersedes an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (JUnit + Robolectric)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # compileSdk 34; build-tools 34.0.0 is the AGP 8.5.2 default.
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # All unit tests live in app/src/test (phase 1: pure JVM, phase 2:
      # Robolectric). The Robolectric android-all jar is fetched from Maven
      # Central at test time, so the runner needs network access (it does).
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
