# Gradle JVM options. AGP 8.x runs well on JDK 17 (bundled with Android Studio 2024.2).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# We do not use AndroidX or any support libraries, so no jetifier needed.
android.useAndroidX=false
