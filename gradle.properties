# Gradle JVM options. AGP 8.x runs well on JDK 17 (bundled with Android Studio 2024.2).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# The app itself uses no AndroidX and no support libraries (no jetifier needed).
# useAndroidX=true is required only because Robolectric (a TEST-scope dependency)
# transitively pulls androidx.test:monitor onto the unit-test classpath; AGP refuses
# to compile unit tests when AndroidX artifacts are present without this flag.
# The production APK is unaffected: the app module declares zero AndroidX deps.
android.useAndroidX=true
