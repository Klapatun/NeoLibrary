plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mylibrary'

    // Modern SDK level required by AGP 8. minSdk stays at 19 for the Android 4.4.4 target.
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.mylibrary'
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // We intentionally target API 19 and use only framework classes.
        abortOnError false
    }

    testOptions {
        unitTests {
            // Robolectric (phase 2) needs the merged resources; returnDefaultValues
            // keeps plain-JVM tests (phase 1) safe if they ever touch a framework stub.
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    tasks.withType(Test) {
        testLogging {
            // Show test stdout (debug prints) and full stack traces in the console.
            showStandardStreams = true
            exceptionFormat = 'full'
        }
    }
}

dependencies {
    // No runtime dependencies: everything is built on the Android framework and JDK
    // classes (java.util.zip, XmlPullParser via android.util.Xml), so the app builds
    // offline against API 19 without AndroidX or any third-party libs.

    // Test-only (never shipped in the APK; the "no extra deps" invariant is about
    // runtime). Phase 1: pure-JVM core with plain JUnit. Phase 2: Android framework
    // (SQLite, Parcel, Intent/Uri, XmlPullParser) via Robolectric — 4.12.x is the
    // release line that still supports API 19 (this project's minSdk) under
    // Gradle 8.7 / AGP 8.5.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
}
