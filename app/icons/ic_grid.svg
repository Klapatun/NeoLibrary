    <g fill="#fff">
        <rect x="9" y="9" width="13" height="13"/>
        <rect x="26" y="9" width="13" height="13"/>
        <rect x="9" y="26" width="13" height="13"/>
        <rect x="26" y="26" width="13" height="13"/>
    </g>
</svg>
